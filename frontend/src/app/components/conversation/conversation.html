<div class="chat-wrapper">
    <div class="message-container">
        <span class="date">{{ today | date:'EEEE d MMM yyyy' }}</span>
        @for (mess of messages(); track mess.send_at) {
        <div class="message" [class.sent]="mess.sender.id === currentUserId()"
            [class.received]="mess.receiver.id === currentUserId()">
            <app-card-message [cardMessage]="mess"></app-card-message>
        </div>
        }
    </div>
    <div class="message-form">

        <input #messageInput type="text" placeholder="Votre message..." width="100%"
            (keyup.enter)="sendMessage(messageInput.value); messageInput.value=''">

        <button (click)="sendMessage(messageInput.value); messageInput.value=''">
            Envoyer
        </button>

    </div>
</div>
