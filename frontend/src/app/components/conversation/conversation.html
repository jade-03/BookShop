<section class="chat">
  <div class="chat-header">
    @if (activeConversation(); as conv) {
    <div class="avatar" id="chatAvatar">{{getInitials(conv.user.pseudo)}}</div>
    <div class="info">
      <h2 id="chatName">{{conv.user.pseudo}}</h2>

    </div>
    }
  </div>
  <div class="messages" id="messages">
    @for (mess of messages();  track mess.id ?? $index) {
    <app-card-message [cardMessage]="mess" [currentUserId]="currentUserId()">
    </app-card-message>
    }
  </div>
  <form class="composer" [formGroup]="messageForm">
    <input formControlName="content" type="text" id="msgInput" placeholder="Écrire un message..."
      (keyup.enter)="sendMessage()">
    <button id="sendBtn" type="submit" aria-label="Envoyer">
      <i class="bi bi-send-fill"></i>
    </button>
  </form>

</section>
