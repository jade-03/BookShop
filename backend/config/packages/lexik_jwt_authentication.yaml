lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: 3600
    
    set_cookies:
        JWT_TOKEN:  # ← Le cookie s'appellera JWT_TOKEN
            httpOnly: true
            samesite: None
            secure: true  # true en production avec HTTPS
            path: '/'
            lifetime: 3600

    token_extractors:
        authorization_header:
            enabled: true
            prefix:  Bearer
            name:    Authorization

        cookie:
            enabled: true
            name:    JWT_TOKEN
    